<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Grid: numbered tools, ideas and notes adapted from 29 mind maps. Read offline in English or Russian.">
  <title>The Grid · 29 cards</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/swiper-bundle.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <button id="toggle-catalog-editor" class="filter" type="button" aria-expanded="false" aria-controls="catalog-editor"></button>
      <div class="language-switch" id="language-switch" role="group" aria-label="Language">
        <button class="language-option is-active" type="button" data-language="en" aria-pressed="true">EN</button>
        <button class="language-option" type="button" data-language="ru" aria-pressed="false">RU</button>
      </div>
    </header>
    <section id="catalog-editor" hidden aria-labelledby="catalog-editor-title">
      <div class="catalog-editor-toolbar"><h2 id="catalog-editor-title"></h2><button id="export-catalog-edits" class="filter" type="button"></button><span id="catalog-draft-status" role="status" aria-live="polite"></span></div>
      <p id="catalog-editor-hint" class="edit-hint"></p>
      <div id="catalog-editor-rows"></div>
    </section>
    <section class="gallery" id="gallery" aria-label="Color story gallery"></section>
    <p id="empty-state" class="empty-state" hidden></p>

    <noscript><p class="noscript">Please enable JavaScript to build and filter the local gallery.</p></noscript>
  </main>

  <dialog class="detail-modal" id="detail-modal" aria-labelledby="modal-title" aria-describedby="modal-description">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close details"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    <header class="modal-header">
      <h2 id="modal-title"></h2>
      <p class="modal-subtitle" id="modal-description"></p>
      <div class="draft-toolbar"><button id="export-edits" type="button"></button><span id="draft-status" role="status" aria-live="polite"></span></div>
    </header>
    <div class="modal-stage swiper" id="modal-swiper">
      <div class="swiper-wrapper" id="modal-slides"></div>
      <button class="modal-arrow modal-prev swiper-button-prev" id="modal-prev" type="button" aria-label="Previous image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="modal-arrow modal-next swiper-button-next" id="modal-next" type="button" aria-label="Next image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div class="modal-thumbs swiper" id="modal-thumbs-swiper" aria-label="Choose image">
      <div class="swiper-wrapper" id="modal-thumbs"></div>
    </div>
    <footer class="modal-footer"><a id="modal-permalink"></a></footer>
  </dialog>

  <script src="vendor/swiper-bundle.min.js"></script>
  <script src="content.js"></script>
  <script src="presentation.js"></script>
  <script src="drafts.js"></script>
  <script src="app.js"></script>
</body>
</html>
